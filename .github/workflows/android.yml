name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL base de la API (VITE_API_URL)'
        required: false
        default: 'https://appsalas.onrender.com'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build web (con URL de la API para la app)
        env:
          VITE_API_URL: ${{ inputs.api_url || 'https://appsalas.onrender.com' }}
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (platform 35)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=sdkmanager; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"; exit ${PIPESTATUS[0]}

      - name: Subir log de Gradle (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: ${{ runner.temp }}/gradle.log
          if-no-files-found: ignore

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Playr-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
